automation:
  methods:
  - method: agent
    framework: Codex
    tool_setup: Zhongpai Gao directed the AI-assisted refinement and proof integration. Original Axiom
      Math research, AxiomProver formalization, and all dependency attributions are retained in the baseline.
  notes: The separate extension uses existing logarithmic control, functional equation and interpolation
    to improve actual numerator estimates; full source validation remains pending.
fidelity:
  divergences: The new explicit target is 1209/1250 rather than 31/32. Universal number-field, finite-order
    Hecke, all-height coverage and original pole exclusions are retained. Every old Lean file is restored
    byte-for-byte to the independently registered original source09afbb4ce6570c1615d58509dc197fc9f0956b7d.
    Its old zero-free theorem is an independent input. Exact new targets are in Gao9672Challenge.lean
    and Gao9672Solution.lean.
